name: Android APK - Peg Bar Preview

on:
  push:
    branches:
      - master
      - feature/japanese-registration-pegbar-viewer
    paths:
      - '.github/workflows/android-apk.yml'
      - 'android/pegbar-preview/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-pegbar-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-preview-apk:
    name: Build Android Peg Bar preview APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        # v3 installs the removed 'tools' package and fails before Gradle.
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        working-directory: android/pegbar-preview
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK
        run: |
          APK=android/pegbar-preview/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 12
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tahoma2D-PegBar-Android-Preview-APK
          path: android/pegbar-preview/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
