name: Tahoma2D Android ARM64 - Native C++ Port

# Exactly one manual workflow. No push, pull_request, or schedule triggers.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tahoma2d-android-one-native-build
  cancel-in-progress: true

jobs:
  native-arm64:
    name: Compile real Tahoma2D editor (Android arm64-v8a)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      REPORT_DIR: ${{ github.workspace }}/android-native-report
      BUILD_DIR: ${{ github.workspace }}/android-native-build
    steps:
      - name: Checkout original Tahoma2D C++ source
        uses: actions/checkout@v4
        with:
          ref: feature/japanese-registration-pegbar-viewer
          path: tahoma2d-src
          persist-credentials: false

      - name: Checkout native build scripts from master
        uses: actions/checkout@v4
        with:
          ref: master
          path: ci-src
          persist-credentials: false

      - name: Validate native ARM64 build scripts
        shell: bash
        run: |
          set -euo pipefail
          for script in "$GITHUB_WORKSPACE"/ci-src/android/native-port/build-*-android.sh; do
            echo "Checking $script"
            bash -n "$script"
          done

      - name: Java 17 for current Android SDK command-line tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Android NDK r21e and SDK 30
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config unzip \
            autoconf automake libtool gettext intltool libglib2.0-dev
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-30" "build-tools;30.0.3" \
                     "ndk;21.4.7075529" "platform-tools"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/21.4.7075529" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/21.4.7075529" >> "$GITHUB_ENV"
          echo "QT_ANDROID_PREFIX=$RUNNER_TEMP/Qt/5.15.2/android" >> "$GITHUB_ENV"

      - name: Qt 5.15.2 Android with QtScript and CMake 3.30
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/qt-tools"
          "$RUNNER_TEMP/qt-tools/bin/pip" install 'cmake==3.30.9' aqtinstall
          echo "$RUNNER_TEMP/qt-tools/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/qt-tools/bin/aqt" install-qt \
             linux android 5.15.2 android --outputdir "$RUNNER_TEMP/Qt" \
             -m qtscript
          test -f "$QT_ANDROID_PREFIX/lib/cmake/Qt5/Qt5Config.cmake"
          test -f "$QT_ANDROID_PREFIX/lib/cmake/Qt5Script/Qt5ScriptConfig.cmake"

      - name: Install verified OpenCV 4.10 Android SDK (arm64-v8a)
        shell: bash
        run: |
          set -euo pipefail
          OPENCV_BASE="$RUNNER_TEMP/opencv-android"
          mkdir -p "$OPENCV_BASE"
          curl --fail --location --retry 3 --retry-delay 5 \
            --output "$OPENCV_BASE/opencv-android-sdk.zip" \
            "https://github.com/opencv/opencv/releases/download/4.10.0/opencv-4.10.0-android-sdk.zip"
          echo "464d55abe64b53af3aeb73197cf4620535abd909916d06e6a8b7c32712013966  $OPENCV_BASE/opencv-android-sdk.zip" | sha256sum --check -
          unzip -q "$OPENCV_BASE/opencv-android-sdk.zip" -d "$OPENCV_BASE"
          OPENCV_CONFIG="$(find "$OPENCV_BASE" -type f -name OpenCVConfig.cmake -print -quit)"
          if [ -z "$OPENCV_CONFIG" ]; then
            echo "::error::OpenCV Android SDK does not contain OpenCVConfig.cmake"
            exit 1
          fi
          if [ -z "$(find "$OPENCV_BASE" -type f -path '*/arm64-v8a/*' -print -quit)" ]; then
            echo "::error::OpenCV Android SDK does not contain arm64-v8a libraries"
            exit 1
          fi
          echo "OpenCV_DIR=$(dirname "$OPENCV_CONFIG")" >> "$GITHUB_ENV"
          echo "OpenCV Android CMake config: $OPENCV_CONFIG"

      - name: Cross-compile bundled modified libTIFF 4.2.0 for ARM64
        shell: bash
        run: |
          set -euo pipefail
          TIFF_ANDROID_PREFIX="$RUNNER_TEMP/tiff-android-prefix"
          bash "$GITHUB_WORKSPACE/ci-src/android/native-port/build-tiff-android.sh" \
            "$GITHUB_WORKSPACE/tahoma2d-src" \
            "$RUNNER_TEMP/tiff-android-build" \
            "$TIFF_ANDROID_PREFIX"
          echo "TIFF_ANDROID_PREFIX=$TIFF_ANDROID_PREFIX" >> "$GITHUB_ENV"

      - name: Cross-compile bundled libPNG 1.6.21 for ARM64
        shell: bash
        run: |
          set -euo pipefail
          PNG_ANDROID_PREFIX="$RUNNER_TEMP/png-android-prefix"
          bash "$GITHUB_WORKSPACE/ci-src/android/native-port/build-png-android.sh" \
            "$GITHUB_WORKSPACE/tahoma2d-src" \
            "$RUNNER_TEMP/png-android-build" \
            "$PNG_ANDROID_PREFIX"
          echo "PNG_ANDROID_PREFIX=$PNG_ANDROID_PREFIX" >> "$GITHUB_ENV"

      - name: Cross-compile bundled SuperLU 4.1 and CBLAS for ARM64
        shell: bash
        run: |
          set -euo pipefail
          SUPERLU_ANDROID_PREFIX="$RUNNER_TEMP/superlu-android-prefix"
          bash "$GITHUB_WORKSPACE/ci-src/android/native-port/build-superlu-android.sh" \
            "$GITHUB_WORKSPACE/tahoma2d-src" \
            "$RUNNER_TEMP/superlu-android-build" \
            "$SUPERLU_ANDROID_PREFIX"
          echo "SUPERLU_ANDROID_PREFIX=$SUPERLU_ANDROID_PREFIX" >> "$GITHUB_ENV"

      - name: Cross-compile libjpeg-turbo for Android ARM64
        shell: bash
        run: |
          set -euo pipefail
          JPEG_ANDROID_PREFIX="$RUNNER_TEMP/jpeg-android-prefix"
          git clone --depth 1 --branch 3.0.4 https://github.com/libjpeg-turbo/libjpeg-turbo.git "$RUNNER_TEMP/libjpeg-turbo-src"
          cmake -S "$RUNNER_TEMP/libjpeg-turbo-src" -B "$RUNNER_TEMP/libjpeg-turbo-build" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$JPEG_ANDROID_PREFIX" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DWITH_TESTS=OFF \
            -DWITH_TOOLS=OFF \
            -DENABLE_SHARED=OFF \
            -DENABLE_STATIC=ON \
            -DWITH_SIMD=OFF \
            -DWITH_JAVA=OFF
          cmake --build "$RUNNER_TEMP/libjpeg-turbo-build" --parallel 2
          cmake --install "$RUNNER_TEMP/libjpeg-turbo-build"
          test -s "$JPEG_ANDROID_PREFIX/lib/libjpeg.a"
          test -f "$JPEG_ANDROID_PREFIX/include/jpeglib.h"
          test -s "$JPEG_ANDROID_PREFIX/lib/libturbojpeg.a"
          test -f "$JPEG_ANDROID_PREFIX/include/turbojpeg.h"
          echo "JPEG_ANDROID_PREFIX=$JPEG_ANDROID_PREFIX" >> "$GITHUB_ENV"

      - name: Cross-compile LZ4 LZO FreeType json-c and libmypaint for ARM64
        shell: bash
        run: |
          set -euo pipefail
          EXTRA_ANDROID_PREFIX="$RUNNER_TEMP/tahoma-deps-arm64"
          mkdir -p "$REPORT_DIR"
          bash "$GITHUB_WORKSPACE/ci-src/android/native-port/build-extra-deps-android.sh" \
            "$GITHUB_WORKSPACE/tahoma2d-src" \
            "$RUNNER_TEMP/tahoma-extra-deps-build" \
            "$EXTRA_ANDROID_PREFIX" 2>&1 | tee "$REPORT_DIR/extra-dependencies.log"
          echo "EXTRA_ANDROID_PREFIX=$EXTRA_ANDROID_PREFIX" >> "$GITHUB_ENV"

      - name: CMake configure, compile and deploy actual editor
        shell: bash
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/ci-src/android/native-port/build-tahoma-android.sh" \
             "$GITHUB_WORKSPACE/tahoma2d-src" "$BUILD_DIR"

      - name: Upload diagnostic logs even on build failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tahoma2D-Android-ARM64-Port-Diagnostics
          path: |
            android-native-report/
            android-native-build/CMakeFiles/CMakeConfigureLog.yaml
            android-native-build/CMakeFiles/CMakeError.log
            android-native-build/CMakeCache.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload real native editor APK only on success
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Tahoma2D-Android-ARM64-Native-APK
          path: android-native-build/android-build/*.apk
          if-no-files-found: error
          retention-days: 14
